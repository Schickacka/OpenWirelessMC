[platformio]
src_dir = src

[env:esp32dev]
platform = espressif32 @ 5.3.0
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.embed_files =
    web_assets/favicon.ico
    web_assets/upload_script.html
    web_assets/footer.html
board_build.partitions = partitions.csv
build_flags =
    -DENABLE_OLED=0
    -fno-jump-tables
